# ── PAGE Platform Render Config ──────────────────────────────────────────────
# Authentication is handled by Firebase Auth + Firestore — no external database
# required.  Django uses SQLite on the ephemeral disk for internal tables
# (admin, sessions, migrations) which is recreated on each deploy via
# `python manage.py migrate` in start.sh.
#
# Firebase env vars (FIREBASE_*) must be set in the Render dashboard.

services:
  # Django Backend Web Service (serves both API and frontend)
  - type: web
    name: page-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: django_backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # ── Firebase (Auth + Firestore — primary data store) ──────────────────
      # Paste the entire contents of your serviceAccountKey.json as one line.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Public web SDK config (safe to expose — used by the frontend)
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      # Firestore feature flags — read user profiles from Firestore
      - key: FS_USERS
        value: "true"
      - key: FS_SOCIAL
        value: "true"
      - key: FS_CHALLENGES
        value: "true"
      - key: FS_NOTIFICATIONS
        value: "true"
      # ── Email ─────────────────────────────────────────────────────────────
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "PAGE <noreply@page.com>"
      # Base URL for password-reset links -- set to your real Render URL
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAWAPAY_API_KEY
        sync: false
      - key: PAWAPAY_API_URL
        value: https://api.pawapay.cloud
      - key: PAWAPAY_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ── Keep-alive cron ──────────────────────────────────────────────────────────
  # Pings /health/ every 10 minutes from outside the web service so Render's
  # free tier never cold-starts. 10 min gives a safe buffer before the 15-min
  # inactivity sleep window.
  #
  # IMPORTANT: Set SERVICE_URL in your Render dashboard environment variables
  # to your actual web service URL, e.g. https://page-backend.onrender.com
  # The cron will not keep the service alive if this points to the wrong URL.
  - type: cron
    name: keep-alive
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: django_backend
    buildCommand: pip install requests
    schedule: "*/10 * * * *"
    startCommand: >
      python -c "
      import requests, os, sys;
      url = os.environ.get('SERVICE_URL', '').rstrip('/');
      if not url:
          print('ERROR: SERVICE_URL env var not set. Set it in the Render dashboard.');
          sys.exit(1);
      try:
          r = requests.get(url + '/health/', timeout=20);
          print('keep-alive ping', r.status_code, url);
          sys.exit(0 if r.status_code < 500 else 1)
      except Exception as e:
          print('keep-alive failed:', e);
          sys.exit(1)
      "
    envVars:
      - key: SERVICE_URL
        sync: true
