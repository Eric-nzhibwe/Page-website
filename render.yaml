databases:
  # PostgreSQL Database (free tier)
  - name: artx-db
    databaseName: artx_platform
    user: artx_user
    plan: free
    region: oregon

services:
  # Django Backend Web Service (serves both API and frontend)
  - type: web
    name: artx-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: django_backend
    buildCommand: bash build.sh
    startCommand: bash start.sh    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: artx-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: artx-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: artx-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: artx-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: artx-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: artx-db
          property: port
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "ARTX Platform <noreply@artxplatform.com>"
      # Base URL for password-reset links -- set to your real Render URL
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAWAPAY_API_KEY
        sync: false
      - key: PAWAPAY_API_URL
        value: https://api.pawapay.cloud
      - key: PAWAPAY_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # ── Keep-alive cron ──────────────────────────────────────────────────────────
  # Pings /health/ every 10 minutes from outside the web service so Render's
  # free tier never cold-starts. 10 min gives a safe buffer before the 15-min
  # inactivity sleep window.
  #
  # IMPORTANT: Set SERVICE_URL in your Render dashboard environment variables
  # to your actual web service URL, e.g. https://artx-backend.onrender.com
  # The cron will not keep the service alive if this points to the wrong URL.
  - type: cron
    name: keep-alive
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: django_backend
    buildCommand: pip install requests
    schedule: "*/10 * * * *"
    startCommand: >
      python -c "
      import requests, os, sys;
      url = os.environ.get('SERVICE_URL', '').rstrip('/');
      if not url:
          print('ERROR: SERVICE_URL env var not set. Set it in the Render dashboard.');
          sys.exit(1);
      try:
          r = requests.get(url + '/health/', timeout=20);
          print('keep-alive ping', r.status_code, url);
          sys.exit(0 if r.status_code < 500 else 1)
      except Exception as e:
          print('keep-alive failed:', e);
          sys.exit(1)
      "
    envVars:
      - key: SERVICE_URL
        sync: true
