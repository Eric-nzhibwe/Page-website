databases:
  # PostgreSQL Database (free tier)
  - name: artx-db
    databaseName: artx_platform
    user: artx_user
    plan: free
    region: oregon

services:
  # Django Backend Web Service (serves both API and frontend)
  - type: web
    name: artx-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: django_backend
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --no-input && uvicorn artx_platform.asgi:application --host 0.0.0.0 --port $PORT --workers 2 --lifespan off
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: artx-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: artx-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: artx-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: artx-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: artx-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: artx-db
          property: port
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "ARTX Platform <noreply@artxplatform.com>"
      # Base URL for password-reset links -- set to your real Render URL
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAWAPAY_API_KEY
        sync: false
      - key: PAWAPAY_API_URL
        value: https://api.pawapay.cloud
      - key: PAWAPAY_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
